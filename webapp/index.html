<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Nexvora Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --green:  #4cae4c;
    --green2: #3d9140;
    --blue:   #337ab7;
    --blue2:  #286090;
    --red:    #c9302c;
    --red2:   #a02420;
    --orange: #e07b00;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    min-height: 100vh;
    padding-bottom: 20px;
  }

  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: white;
    padding: 16px;
    text-align: center;
    border-bottom: 3px solid #e94560;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .header .subtitle {
    font-size: 12px;
    opacity: 0.8;
    margin-top: 4px;
  }

  .balance-card {
    margin: 12px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 14px;
    padding: 16px;
    color: white;
    text-align: center;
    box-shadow: 0 4px 15px rgba(102,126,234,0.4);
  }

  .balance-card .label { font-size: 12px; opacity: 0.85; }
  .balance-card .amount { font-size: 28px; font-weight: 800; margin: 4px 0; }
  .balance-card .uid { font-size: 11px; opacity: 0.7; }

  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 14px 12px 6px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 0 12px;
    margin-bottom: 8px;
  }

  .grid-1 {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    padding: 0 12px;
    margin-bottom: 8px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 13px 10px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    color: white;
    cursor: pointer;
    text-align: center;
    line-height: 1.2;
    transition: transform 0.1s, opacity 0.1s;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    -webkit-tap-highlight-color: transparent;
    word-break: keep-all;
  }

  .btn:active {
    transform: scale(0.96);
    opacity: 0.9;
  }

  .btn-green  { background: linear-gradient(145deg, var(--green), var(--green2)); }
  .btn-blue   { background: linear-gradient(145deg, var(--blue), var(--blue2)); }
  .btn-red    { background: linear-gradient(145deg, var(--red), var(--red2)); }
  .btn-orange { background: linear-gradient(145deg, var(--orange), #b86000); }
  .btn-fire   {
    background: linear-gradient(145deg, #ff6b35, #f7931e);
    font-size: 13px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { box-shadow: 0 3px 8px rgba(255,107,53,0.4); }
    50%      { box-shadow: 0 3px 20px rgba(255,107,53,0.8); }
  }

  .btn .icon { font-size: 18px; }

  /* Admin panel specific */
  .admin-header {
    background: linear-gradient(135deg, #1a1a2e, #2d1b69);
    color: white;
    padding: 16px;
    text-align: center;
    border-bottom: 3px solid #f7931e;
  }

  .hidden { display: none; }

  /* Page system */
  .page { display: none; }
  .page.active { display: block; }

  .back-row {
    padding: 0 12px;
    margin-bottom: 8px;
  }

  .divider {
    height: 1px;
    background: rgba(0,0,0,0.08);
    margin: 10px 12px;
  }
</style>
</head>
<body>

<!-- ====== USER MAIN MENU PAGE ====== -->
<div class="page active" id="page-main">

  <div class="header">
    <h1>🛒 Nexvora Shop</h1>
    <div class="subtitle">Premium Digital Marketplace</div>
  </div>

  <div class="balance-card">
    <div class="label">💰 Your Balance</div>
    <div class="amount" id="balance-amount">$0.00</div>
    <div class="uid" id="uid-label">Loading...</div>
  </div>

  <!-- ChatGPT Promo Banner -->
  <div class="grid-1" id="promo-section">
    <button class="btn btn-fire" onclick="sendAction('user_chatgpt_promo')">
      <span class="icon">🔥</span> ChatGPT 3-Month Promo — $1.00
    </button>
  </div>

  <div class="section-title">🛍 Shop</div>
  <div class="grid">
    <button class="btn btn-green" onclick="sendAction('user_categories')">
      <span class="icon">🛍</span> Shop / Products
    </button>
    <button class="btn btn-blue" onclick="sendAction('user_wallet')">
      <span class="icon">💳</span> My Wallet
    </button>
  </div>

  <div class="section-title">👤 Account</div>
  <div class="grid">
    <button class="btn btn-blue" onclick="sendAction('user_orders')">
      <span class="icon">📦</span> My Orders
    </button>
    <button class="btn btn-green" onclick="sendAction('user_profile')">
      <span class="icon">👤</span> My Profile
    </button>
  </div>

  <div class="section-title">⚙️ More</div>
  <div class="grid">
    <button class="btn btn-blue" onclick="sendAction('user_support')">
      <span class="icon">💬</span> Support
    </button>
    <button class="btn btn-green" onclick="sendAction('user_language_menu')">
      <span class="icon">🌐</span> Language
    </button>
  </div>

  <!-- Admin button (shown only to admin) -->
  <div class="grid-1 hidden" id="admin-section">
    <div class="divider"></div>
    <button class="btn btn-red" onclick="showPage('page-admin')">
      <span class="icon">🛠</span> Admin Control Panel
    </button>
  </div>

</div>

<!-- ====== ADMIN PANEL PAGE ====== -->
<div class="page" id="page-admin">

  <div style="background:linear-gradient(135deg,#1a1a2e,#2d1b69);color:white;padding:16px;text-align:center;border-bottom:3px solid #f7931e;">
    <div style="font-size:18px;font-weight:800;">🛠 Admin Panel</div>
    <div style="font-size:11px;opacity:0.7;margin-top:4px;">Nexvora Control Center</div>
  </div>

  <div style="margin:12px;background:linear-gradient(135deg,#e94560,#c62a47);border-radius:12px;padding:12px 16px;color:white;font-size:13px;font-weight:600;">
    ⚡ Admin: Full control over your bot
  </div>

  <div class="section-title">📦 Products</div>
  <div class="grid">
    <button class="btn btn-green" onclick="sendAction('adm_add_product')">
      <span class="icon">➕</span> Add Product
    </button>
    <button class="btn btn-blue" onclick="sendAction('adm_stock_menu')">
      <span class="icon">📬</span> Add Stock
    </button>
  </div>
  <div class="grid">
    <button class="btn btn-blue" onclick="sendAction('adm_list_products')">
      <span class="icon">📦</span> Products
    </button>
    <button class="btn btn-green" onclick="sendAction('adm_promo_menu')">
      <span class="icon">💲</span> Promo & Price
    </button>
  </div>

  <div class="section-title">👥 Users & Settings</div>
  <div class="grid">
    <button class="btn btn-blue" onclick="sendAction('adm_cat_menu')">
      <span class="icon">📂</span> Categories
    </button>
    <button class="btn btn-green" onclick="sendAction('adm_users_menu')">
      <span class="icon">💵</span> Users & Balance
    </button>
  </div>
  <div class="grid">
    <button class="btn btn-green" onclick="sendAction('adm_broadcast_start')">
      <span class="icon">📢</span> Broadcast Msg
    </button>
    <button class="btn btn-blue" onclick="sendAction('adm_settings')">
      <span class="icon">⚙️</span> Bot Settings
    </button>
  </div>

  <div class="section-title">🔙 Navigation</div>
  <div class="grid-1 back-row">
    <button class="btn btn-red" onclick="showPage('page-main')">
      <span class="icon">◀️</span> Back to Customer View
    </button>
  </div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// Read init data
const user = tg.initDataUnsafe?.user || {};
const userId = user.id || 0;
const firstName = user.first_name || 'User';

// Update UI with user info
document.getElementById('uid-label').textContent = `👤 ${firstName}  |  🆔 ${userId}`;

// Fetch balance from bot backend
fetchBalance();

async function fetchBalance() {
  try {
    // Balance is passed via query param when bot opens the webapp
    const params = new URLSearchParams(window.location.search);
    const bal = params.get('balance') || '0.00';
    const sym = params.get('symbol') || '$';
    const promoEnabled = params.get('promo') || '1';
    const isAdmin = params.get('admin') || '0';

    document.getElementById('balance-amount').textContent = `${sym}${parseFloat(bal).toFixed(2)}`;

    // Show/hide promo
    if (promoEnabled !== '1') {
      document.getElementById('promo-section').style.display = 'none';
    }

    // Show admin button
    if (isAdmin === '1') {
      document.getElementById('admin-section').classList.remove('hidden');
    }
  } catch(e) {
    console.log('Could not fetch balance', e);
  }
}

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  window.scrollTo(0, 0);
}

function sendAction(action) {
  // Send action back to the bot
  tg.sendData(JSON.stringify({ action: action, user_id: userId }));
}
</script>
</body>
</html>
